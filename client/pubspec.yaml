name: fulfilled
description: Fulfilled — calorie/food/weight tracker. Flutter client for the LoseIt API.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management. Hand-written providers (Provider / StateNotifierProvider /
  # AsyncNotifier) — no `@riverpod` codegen for now (the ecosystem version
  # skew with newer analyzer SDKs makes the build fragile; we'll reintroduce
  # codegen once the major-version churn settles).
  flutter_riverpod: ^2.5.1

  # Routing. v14+ required by architecture §4 (ShellRoute + observable router).
  go_router: ^14.6.2

  # HTTP. Repositories own all calls; widgets never see Dio.
  dio: ^5.7.0

  # Wire-decimal handling. T-17: Decimal in, formatted out.
  decimal: ^3.0.2

  # i18n number/date formatting. Drives thousands separators and EEEE, MMM d.
  intl: ^0.19.0

  # Local persistence: outbox Hive box + cached repositories.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Outbox flush trigger (architecture §5 Outbox subsection).
  connectivity_plus: ^6.1.0

  # Mobile-only barcode scanning. Architecture names ^5.x; web is a no-op which
  # is what we want (T-19 / §7 "No barcode UI on web").
  mobile_scanner: ^5.2.3

  # UUIDs for outbox entry ids and optimistic LogEntry ids.
  uuid: ^4.5.1

  # Platform secure storage for the bearer token (iOS Keychain / Android
  # EncryptedSharedPrefs / web `window.localStorage`). LOG-003 — architect
  # §3.5, the one new pub dep in the login pack. The web tier is same-origin
  # to the API so the localStorage value is gated by the browser's same-origin
  # policy; documented in `data/secure_token_store.dart`.
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

  # Mobile OIDC sign-in. Opens the backend's
  # `/api/v1/auth/oidc/{provider}/start?mobile_callback=fulfilled://oidc-callback`
  # in a system-browser session (ASWebAuthenticationSession on iOS,
  # Chrome Custom Tab on Android) and waits for the OS to route the
  # registered `fulfilled://` scheme back to the app with
  # `?oidc_code=<handoff>` appended. The system-browser approach is
  # the spec-correct path Apple and Google require for auth flows.
  # The `fulfilled` scheme is declared in iOS Info.plist and Android
  # Manifest (see client/ios/Runner/Info.plist + client/android/...).
  flutter_web_auth_2: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Inter font: bundle, do not load from a CDN at runtime (architecture §2.2).
  # The actual .ttf assets must be added under `assets/fonts/Inter/` by the
  # developer running `flutter create .`; the entry stays declarative here so
  # the first time the assets land the bundling Just Works.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
