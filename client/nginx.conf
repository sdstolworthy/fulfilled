# Nginx config for serving the Flutter web build behind Coolify's Traefik.
#
# - SPA routing: any 404 falls back to index.html so client-side routes work.
# - Aggressive caching for hashed assets; no-cache for index.html itself so
#   deploys propagate immediately.
# - gzip on for the obvious text types.
# - X-Forwarded-* headers are trusted (Coolify's proxy is the only path in).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint hit by the container healthcheck.
    location = /health.txt {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # SPA routing: serve index.html for any missing path so the Flutter
    # router can take over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Hashed Flutter build outputs (main.dart.js, *.part.js, canvaskit/*,
    # assets/*, fonts/*) are content-addressed by Flutter's build pipeline
    # and safe to cache aggressively.
    location ~* \.(?:js|css|wasm|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # Modest hardening. Coolify terminates TLS upstream.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
