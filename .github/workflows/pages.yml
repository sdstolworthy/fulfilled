name: Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  openapi:
    name: Build OpenAPI docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI spec
        run: |
          npx --yes @redocly/cli@latest lint \
            --config server/specs/redocly.yaml \
            server/specs/openapi.yaml

      - name: Build static docs
        run: |
          mkdir -p out
          npx --yes @redocly/cli@latest build-docs \
            --config server/specs/redocly.yaml \
            server/specs/openapi.yaml \
            --output out/index.html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-docs
          path: out
          if-no-files-found: error

  flutter:
    name: Build Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Flutter project
        id: detect
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.has_app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble app output
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p out
          if [ "${{ steps.detect.outputs.has_app }}" = "true" ]; then
            cd app
            flutter pub get
            # Project-pages serves at /<repo>/, so the app's base-href must
            # match the sub-path it's deployed under. If a custom domain is
            # ever configured, change this to "/app/".
            flutter build web --release \
              --base-href "/${REPO_NAME}/app/"
            cp -r build/web/. "$GITHUB_WORKSPACE/out/"
          else
            echo "No app/pubspec.yaml found — using stub from .github/pages/app-stub."
            cp -r .github/pages/app-stub/. out/
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-app
          path: out
          if-no-files-found: error

  assemble:
    name: Assemble and deploy
    needs: [openapi, flutter]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: site-docs
          path: dist/docs

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: site-app
          path: dist/app

      - name: Add landing page
        run: cp .github/pages/index.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
