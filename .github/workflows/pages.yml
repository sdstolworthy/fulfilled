name: Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  openapi:
    name: Build OpenAPI docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI spec
        run: |
          npx --yes @redocly/cli@latest lint \
            --config server/specs/redocly.yaml \
            server/specs/openapi.yaml

      - name: Build static docs
        run: |
          mkdir -p out
          npx --yes @redocly/cli@latest build-docs \
            --config server/specs/redocly.yaml \
            server/specs/openapi.yaml \
            --output out/index.html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-docs
          path: out
          if-no-files-found: error

  flutter:
    name: Build Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform folder
        # Web/ is gitignored (regenerable). Recreate before build.
        working-directory: client
        run: flutter create . --platforms=web

      - name: Fetch packages
        working-directory: client
        run: flutter pub get

      - name: Build Flutter web
        working-directory: client
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Project-pages serves at /<repo>/; the app is mounted at /app/
          # within that. If a custom domain is ever configured, the base-href
          # collapses to "/app/".
          flutter build web --release \
            --base-href "/${REPO_NAME}/app/"

      - name: Assemble app output
        run: |
          mkdir -p out
          cp -r client/build/web/. out/

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-app
          path: out
          if-no-files-found: error

  assemble:
    name: Assemble and deploy
    needs: [openapi, flutter]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: site-docs
          path: dist/docs

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: site-app
          path: dist/app

      - name: Add landing page
        run: cp .github/pages/index.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
