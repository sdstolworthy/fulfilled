name: Build server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: git.stolworthy.co
  IMAGE: git.stolworthy.co/sdstolworthy/fulfilled

jobs:
  build:
    name: Build & push to Gitea
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          # `sha-<short>` is what Image Updater matches on (see the
          # webapps Application annotations in homeassistant). `latest`
          # is here for humans running `docker pull` ad-hoc and is not
          # consumed by the cluster.
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
