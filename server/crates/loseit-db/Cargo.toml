[package]
name = "loseit-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
loseit-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hmac.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["json"] }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

# Pg integration tests under tests/. The `#[sqlx::test]` macro spins up a
# fresh per-test database, runs migrations, and hands us a `PgPool`; that
# needs sqlx's `macros` + `migrate` features (already on via the workspace
# dep) plus a tokio runtime in scope.
loseit-core.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
