<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 · Create custom food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --ink:#1A1D1A; --ink-2:#5C625C; --ink-3:#9AA09A;
    --line:#E6E5E0; --line-2:#EFEEE9; --accent:#1F5F5B; --accent-soft:#E4EEEC;
    --danger:#B5552E; --danger-soft:#FBEBE2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#ECECE6;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px}
  .caption{font-size:13px;color:#5C625C;margin-bottom:12px}
  .device{width:390px;height:844px;background:var(--bg);border-radius:36px;box-shadow:0 20px 60px rgba(20,30,25,.18);overflow:hidden;position:relative;border:1px solid #1a1a1a}
  .screen{width:100%;height:100%;display:flex;flex-direction:column}
  .statusbar{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-size:13px;font-weight:600}
  .topbar{padding:6px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .topbar .cancel{font-size:15px;color:var(--ink-2);font-weight:500}
  .topbar h1{margin:0;font-size:16px;font-weight:600}
  .topbar .save{font-size:15px;color:var(--accent);font-weight:600}
  .steps{display:flex;gap:6px;padding:10px 20px 4px;align-items:center}
  .steps .pill{font-size:11px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;font-weight:600}
  .steps .bar{flex:1;height:4px;background:#EFEEE9;border-radius:2px;overflow:hidden;margin:0 8px}
  .steps .bar span{display:block;height:100%;background:var(--accent);width:50%}
  .body{flex:1;overflow-y:auto;padding:8px 20px 30px}
  .section{margin-top:18px}
  .section h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:600}
  .fld{margin-bottom:12px}
  .fld label{font-size:13px;color:var(--ink-2);margin-bottom:6px;display:block;font-weight:500}
  .fld input, .fld .ip{height:46px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-family:inherit;font-size:15px;color:var(--ink);font-weight:500;outline:none}
  .fld input:focus{border-color:var(--accent)}
  .fld.err input{border-color:var(--danger);background:#FFF8F3}
  .fld .help{font-size:12px;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:6px}
  .fld.err .help{color:var(--danger)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .unit{position:relative}
  .unit .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3);text-transform:lowercase;font-weight:500}
  .servingbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .servingbox .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .servingbox .head h3{margin:0;font-size:14px;font-weight:600}
  .servingbox .head .add{font-size:13px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px}
  .srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
  .srow:first-of-type{border-top:0;padding-top:0}
  .srow .ipl{flex:1;height:44px;background:#FAFAF8;border:1px solid var(--line);border-radius:10px;padding:0 12px;display:flex;align-items:center;font-size:14px;font-weight:500}
  .srow .ipg{width:96px;height:44px;background:#FAFAF8;border:1px solid var(--line);border-radius:10px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500}
  .srow .ipg small{color:var(--ink-3);font-size:11px}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px}
  .source{display:flex;gap:8px;margin-top:6px}
  .source span{padding:6px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:500;color:var(--ink-2)}
  .source span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .footer{padding:14px 20px 28px;background:#fff;border-top:1px solid var(--line)}
  .save-cta{height:52px;width:100%;background:var(--accent);color:#fff;border-radius:14px;font-weight:600;font-size:16px;border:0}
  .save-cta.disabled{background:#C4D2D0;color:#fff}
</style>
</head>
<body>
  <div class="caption">05 · Create custom food (mobile)</div>
  <div class="device">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span></span></div>
      <div class="topbar">
        <span class="cancel">Cancel</span>
        <h1>New food</h1>
        <span class="save">Save</span>
      </div>

      <div class="steps">
        <span class="pill" style="color:var(--accent)">Details</span>
        <div class="bar"><span></span></div>
        <span class="pill">Nutrition</span>
        <div class="bar"><span style="width:0"></span></div>
        <span class="pill">Servings</span>
      </div>

      <div class="body">
        <div class="section">
          <h2>Basics</h2>
          <div class="fld">
            <label>Name</label>
            <input value="Mom's lasagna" />
          </div>
          <div class="fld">
            <label>Brand (optional)</label>
            <input value="Homemade" />
          </div>
          <div class="fld">
            <label>Barcode (optional)</label>
            <div class="ip" style="display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-weight:500">
              Scan or enter
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 7V5a1 1 0 0 1 1-1h2M4 17v2a1 1 0 0 0 1 1h2M20 7V5a1 1 0 0 0-1-1h-2M20 17v2a1 1 0 0 1-1 1h-2M7 8v8M10 8v8M13 8v8M16 8v8" stroke="#1F5F5B" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Nutrition per 100 g</h2>
          <div class="fld">
            <label>Calories</label>
            <div class="unit"><input value="248" /><span class="u">kcal</span></div>
          </div>
          <div class="row3">
            <div class="fld">
              <label>Protein</label>
              <div class="unit"><input value="14" /><span class="u">g</span></div>
            </div>
            <div class="fld err">
              <label>Carbs</label>
              <div class="unit"><input value="" placeholder="—" /><span class="u">g</span></div>
              <div class="help">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor"/></svg>
                Required
              </div>
            </div>
            <div class="fld">
              <label>Fat</label>
              <div class="unit"><input value="13" /><span class="u">g</span></div>
            </div>
          </div>
          <div class="row3">
            <div class="fld">
              <label>Fiber</label>
              <div class="unit"><input value="3" /><span class="u">g</span></div>
            </div>
            <div class="fld">
              <label>Sugar</label>
              <div class="unit"><input value="4" /><span class="u">g</span></div>
            </div>
            <div class="fld">
              <label>Sodium</label>
              <div class="unit"><input value="410" /><span class="u">mg</span></div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Servings</h2>
          <div class="servingbox">
            <div class="head">
              <h3>Default<span class="badge">Default</span></h3>
              <span class="add">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Add serving
              </span>
            </div>
            <div class="srow">
              <div class="ipl">1 large square</div>
              <div class="ipg">325 <small>g</small></div>
            </div>
            <div class="srow">
              <div class="ipl">½ square</div>
              <div class="ipg">163 <small>g</small></div>
            </div>
            <div class="srow">
              <div class="ipl">100 g (raw)</div>
              <div class="ipg">100 <small>g</small></div>
            </div>
          </div>
        </div>

        <div style="height:8px"></div>
      </div>

      <div class="footer">
        <button class="save-cta disabled">Fix 1 error to save</button>
      </div>
    </div>
  </div>
</body>
</html>
