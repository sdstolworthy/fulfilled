openapi: 3.1.0
info:
  title: LoseIt API
  version: "0.1.0"
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  description: |
    HTTP API for the LoseIt server. All routes (except `/health`) require a
    bearer token in the `Authorization` header. Token validation is delegated
    to a pluggable authenticator; the first identity seen for a given
    `(issuer, external_id)` pair is auto-provisioned into a local user row.

    All paths are served under the `/api/v1` prefix.

    Decimal-valued fields (weights, nutrition, quantities) are transported as
    JSON numbers but produced/consumed by the server as arbitrary-precision
    decimals — clients should avoid binary float round-trips for fields like
    `weight_kg`, `grams`, and `quantity`.

    ## v1 pre-release wire-shape changes

    The following endpoints returned bare JSON arrays in early drafts and
    now return paginated envelopes (`{ results, total, limit, offset }`):

    * `GET /log`
    * `GET /weights`

    Both endpoints' `from` and `to` query parameters were previously
    required and are now optional. With no parameters, the response is
    the 100 most-recent entries across the full history.

    The `GET /foods/search` response schema migrated from the bespoke
    `FoodSearchPage` shape to the unified `PaginatedFoodSearchHits`
    envelope; field names are unchanged.

servers:
  - url: "https://{host}/api/v1"
    description: LoseIt API. Override `host` for local development (e.g. `127.0.0.1:8080`).
    variables:
      host:
        default: api.loseit.invalid
        description: API hostname (and optional port).

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Sign-in and token issuance.
  - name: Health
    description: Liveness probes for orchestration and monitoring.
  - name: Profile
    description: The authenticated user's own profile.
  - name: Weights
    description: Self-recorded body-weight history.
  - name: Goals
    description: Weight and macronutrient targets, scoped to date ranges.
  - name: Foods
    description: Food catalogue lookups, custom-food CRUD, and search.
  - name: Servings
    description: Per-food serving sizes (default, system-seeded, and user-defined).
  - name: Log
    description: Food log entries with frozen nutrition snapshots.
  - name: Days
    description: Per-day rollups of logged nutrition against the active goal.

paths:
  /health:
    get:
      tags: [Health]
      operationId: health_check
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: Service is unhealthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with username + password
      description: |
        Exchanges a local username + password for an opaque server-issued
        bearer token. Use the returned `token` in `Authorization: Bearer
        <token>` headers on subsequent requests. Tokens have a sliding-
        window expiry refreshed on each authenticated request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credentials accepted; token issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /me:
    get:
      tags: [Profile]
      operationId: get_me
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Profile]
      operationId: update_me
      summary: Update profile fields
      description: |
        Partial update. Any omitted field is left unchanged. `sex` and
        `activity_level` must be one of the documented enum values or the
        server returns `400 bad_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Profile]
      operationId: delete_me
      summary: Permanently delete the authenticated user and all their data
      description: |
        Cascades deletion across food log entries, weights, goals, and the
        caller's custom foods. Returns 204 on success.
        Note: subsequent requests with the same token will re-provision a
        fresh user row (the token still validates locally via the JWT issuer).
        This is accepted v1 behaviour.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /weights:
    post:
      tags: [Weights]
      operationId: create_weight
      summary: Record a weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeightCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Weight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Weights]
      operationId: list_weights
      summary: List weight entries
      description: |
        Lists the caller's weight entries, newest recorded-day first.

        All four query parameters are optional. With no parameters, the
        response is the 100 most-recent entries across the full history.
        Default `limit` is 100; server silently clamps requests above 500.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive lower bound on `recorded_on`.
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive upper bound on `recorded_on`.
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page size; 0 or omitted → 100.
        - in: query
          name: offset
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page offset, starting at 0.
      responses:
        "200":
          description: Page of weight entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedWeights" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /weights/{id}:
    delete:
      tags: [Weights]
      operationId: delete_weight
      summary: Delete a weight entry
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /goals:
    post:
      tags: [Goals]
      operationId: create_goal
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Goals]
      operationId: list_goals
      summary: List the caller's goals
      responses:
        "200":
          description: All goals belonging to the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /goals/active:
    get:
      tags: [Goals]
      operationId: get_active_goal
      summary: Get the goal active on a given date
      parameters:
        - in: query
          name: on
          schema: { type: string, format: date }
          description: Date to evaluate. Defaults to today (UTC).
      responses:
        "200":
          description: Active goal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /goals/{id}:
    patch:
      tags: [Goals]
      operationId: update_goal
      summary: Update a goal
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalPatch" }
      responses:
        "200":
          description: Updated goal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Goals]
      operationId: delete_goal
      summary: Delete a goal
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods/search:
    get:
      tags: [Foods]
      operationId: search_foods
      summary: Search foods
      description: |
        Full-text search across the foods catalogue (OFF, USDA, and the
        caller's custom foods). A blank `q` returns `400 bad_request`.

        Default `limit` is 100; the server silently clamps requests above
        500. Sentinel foods used by `POST /log/quick_add` are excluded
        from results.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
          description: Search query string.
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page size. Server applies a cap if exceeded.
        - in: query
          name: offset
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page offset, starting at 0.
      responses:
        "200":
          description: Search page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedFoodSearchHits" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/mine:
    get:
      tags: [Foods]
      operationId: list_my_foods
      summary: List the caller's custom foods
      description: |
        Lists `user`-source foods owned by the caller, optionally filtered
        by a case-insensitive substring match against `name` and `brands`.
        The sentinel `__quick_add__` food (used by `POST /log/quick_add`)
        is never returned.

        Default `limit` is 100; server silently clamps requests above 500.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
          description: Substring filter; empty/whitespace is treated as absent.
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page size; 0 or omitted → 100.
        - in: query
          name: offset
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page offset, starting at 0.
      responses:
        "200":
          description: Page of the caller's custom foods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedFoodSearchHits" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/recent:
    get:
      tags: [Foods]
      operationId: list_recent_foods
      summary: Foods the caller has logged most recently
      parameters:
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 1 }
          description: Maximum number of foods to return.
      responses:
        "200":
          description: Recent foods.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FoodSearchHit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/frequent:
    get:
      tags: [Foods]
      operationId: list_frequent_foods
      summary: Foods the caller logs most frequently
      parameters:
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 1 }
          description: Maximum number of foods to return.
      responses:
        "200":
          description: Frequent foods.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FoodSearchHit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/barcode/{barcode}:
    get:
      tags: [Foods]
      operationId: get_food_by_barcode
      summary: Look up a food by barcode
      parameters:
        - in: path
          name: barcode
          required: true
          schema: { type: string }
          description: Barcode string (EAN/UPC).
      responses:
        "200":
          description: Food detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods:
    post:
      tags: [Foods]
      operationId: create_food
      summary: Create a custom food
      description: |
        Creates a `user`-source food owned by the caller. A default
        100 g system serving is auto-seeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoodCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /foods/{id}:
    get:
      tags: [Foods]
      operationId: get_food
      summary: Get a food by id, including its servings
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Food detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Foods]
      operationId: update_food
      summary: Update a custom food
      description: Only the owner of a `user`-source food may patch it.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoodPatch" }
      responses:
        "200":
          description: Updated food.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Foods]
      operationId: delete_food
      summary: Delete a custom food
      description: |
        Returns `403` if the food isn't owned by the caller and `409` if
        the food is referenced by existing log entries.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /foods/{food_id}/servings:
    post:
      tags: [Servings]
      operationId: create_serving
      summary: Create a serving on a food
      parameters:
        - in: path
          name: food_id
          required: true
          schema: { type: string, format: uuid }
          description: Id of the food the serving belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServingCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Serving" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /servings/{id}:
    patch:
      tags: [Servings]
      operationId: update_serving
      summary: Update a serving
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServingPatch" }
      responses:
        "200":
          description: Updated serving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Serving" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Servings]
      operationId: delete_serving
      summary: Delete a serving
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /servings/{id}/default:
    post:
      tags: [Servings]
      operationId: set_default_serving
      summary: Make this serving the default for its food
      description: |
        Atomically flips the `is_default` flag: the named serving becomes
        the food's default and any previous default is unset.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The serving in its post-flip state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Serving" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /log:
    post:
      tags: [Log]
      operationId: create_log_entry
      summary: Record a food log entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogCreate" }
      responses:
        "201":
          description: Created. The response includes a frozen nutrition snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Log]
      operationId: list_log_entries
      summary: List log entries
      description: |
        Lists the caller's log entries, newest consumed-day first.

        All four query parameters are optional. With no parameters, the
        response is the 100 most-recent entries across the full history.
        `from`/`to` are both inclusive bounds on `consumed_on`. Default
        `limit` is 100; server silently clamps requests above 500.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive lower bound on `consumed_on`.
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive upper bound on `consumed_on`.
        - in: query
          name: limit
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page size; 0 or omitted → 100.
        - in: query
          name: offset
          schema: { type: integer, format: int64, minimum: 0 }
          description: Page offset, starting at 0.
      responses:
        "200":
          description: Page of log entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedLogEntries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /log/quick_add:
    post:
      tags: [Log]
      operationId: quick_add_log_entry
      summary: Log raw calories without choosing a food
      description: |
        Creates a log entry against a per-user sentinel "Quick Add" food
        owned by the caller. Only `calories_kcal` carries a value; all
        macronutrient fields on the returned snapshot are null. The
        sentinel food is hidden from `/foods/search`, `/foods/mine`,
        `/foods/recent`, and `/foods/frequent`. It is auto-provisioned on
        first use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickAddBody" }
      responses:
        "201":
          description: Created. The response includes a frozen snapshot with macros null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /log/copy:
    post:
      tags: [Log]
      operationId: copy_log_day
      summary: Copy a day's log entries to another day
      description: |
        Re-snapshots every entry in `from_date` (optionally filtered by
        `meal`) onto `to_date`. Snapshots are recomputed from the *current*
        food, so edits to a custom food between the two dates are
        reflected in the copied entries.

        Entries whose food is no longer visible to the caller, or whose
        serving has been deleted, are silently skipped. `from_date ==
        to_date` and `from_date > to_date` (backward copy) are both
        permitted. If `to_date` already has entries, they coexist with the
        new ones — nothing is replaced.

        The response is wrapped (`{ copied: [...] }`) rather than a bare
        array so future fields (e.g. `skipped`) can be added without
        breaking the wire shape.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyDayBody" }
      responses:
        "201":
          description: Created. Body contains the inserted entries, in input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopyDayResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /log/{id}:
    patch:
      tags: [Log]
      operationId: update_log_entry
      summary: Update a log entry
      description: |
        `food_id` is immutable — sending one is a `400`. A `null` `note`
        clears the existing value; omitting the field leaves it unchanged.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogPatch" }
      responses:
        "200":
          description: Updated entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Log]
      operationId: delete_log_entry
      summary: Delete a log entry
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /days/{date}/summary:
    get:
      tags: [Days]
      operationId: get_day_summary
      summary: Per-day rollup of logged nutrition
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
          description: Calendar date to summarize.
      responses:
        "200":
          description: Day summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DaySummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token validated by the configured authenticator. In
        development a static `DEV_AUTH_BYPASS` token may be used; in
        production tokens are expected to be JWTs validated against a JWKS
        endpoint.

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: Resource identifier.

  responses:
    BadRequest:
      description: Request was malformed or failed domain validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Domain invariant prevents the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error identifier.
          examples:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - upstream_error
            - internal_error
        message:
          type: string

    Decimal:
      description: Arbitrary-precision decimal serialized as a JSON number.
      type: number

    NullableDecimal:
      description: Arbitrary-precision decimal or `null`.
      type: [number, "null"]

    Sex:
      type: string
      enum: [male, female, other]

    ActivityLevel:
      type: string
      enum: [sedentary, light, moderate, active, very_active]

    Meal:
      type: string
      enum: [breakfast, lunch, dinner, snack]

    FoodSource:
      type: string
      enum: [off, user, usda]

    FoodKind:
      type: string
      enum: [normal, quick_add]
      description: |
        Role of the food. `normal` is the default for user-created or
        imported foods. `quick_add` is the per-user sentinel row
        backing `POST /log/quick_add` entries; the FE uses this to
        route Edit on quick-add log entries to the quick-add sheet.

    ServingSource:
      type: string
      enum: [off, user, system]

    NutriscoreGrade:
      type: string
      enum: [a, b, c, d, e]

    WeightUnit:
      type: string
      enum: [kg, lb, st]

    HeightUnit:
      type: string
      enum: [cm, ft_in]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: |
            Opaque bearer token. Send back as
            `Authorization: Bearer <token>` on subsequent requests.
        expires_at:
          type: string
          format: date-time
          description: Absolute kill date for the token, in UTC.

    User:
      type: object
      required: [id, issuer, external_id, created_at, updated_at, weight_unit, height_unit]
      properties:
        id: { type: string, format: uuid }
        issuer: { type: string }
        external_id: { type: string }
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: [string, "null"]
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          $ref: "#/components/schemas/NullableDecimal"
        activity_level:
          oneOf:
            - $ref: "#/components/schemas/ActivityLevel"
            - type: "null"
        weight_unit: { $ref: "#/components/schemas/WeightUnit" }
        height_unit: { $ref: "#/components/schemas/HeightUnit" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProfilePatch:
      type: object
      description: Any omitted field is left unchanged.
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        sex: { $ref: "#/components/schemas/Sex" }
        birth_date: { type: string, format: date }
        height_cm: { $ref: "#/components/schemas/Decimal" }
        activity_level: { $ref: "#/components/schemas/ActivityLevel" }
        weight_unit: { $ref: "#/components/schemas/WeightUnit" }
        height_unit: { $ref: "#/components/schemas/HeightUnit" }

    Weight:
      type: object
      required: [id, recorded_on, weight_kg, created_at]
      properties:
        id: { type: string, format: uuid }
        recorded_on: { type: string, format: date }
        recorded_at_local:
          type: [string, "null"]
          description: Local time-of-day component (HH:MM:SS), if known.
        weight_kg: { $ref: "#/components/schemas/Decimal" }
        note:
          type: [string, "null"]
        created_at: { type: string, format: date-time }

    WeightCreate:
      type: object
      required: [recorded_on, weight_kg]
      properties:
        recorded_on: { type: string, format: date }
        recorded_at_local:
          type: string
          description: Local time-of-day component (HH:MM:SS).
        weight_kg: { $ref: "#/components/schemas/Decimal" }
        note: { type: string }

    Goal:
      type: object
      required: [id, starts_on, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
        start_weight_kg:
          $ref: "#/components/schemas/NullableDecimal"
        target_weight_kg:
          $ref: "#/components/schemas/NullableDecimal"
        weekly_rate_kg:
          $ref: "#/components/schemas/NullableDecimal"
        daily_calorie_target:
          type: [integer, "null"]
          format: int32
        protein_g_target:
          $ref: "#/components/schemas/NullableDecimal"
        carbs_g_target:
          $ref: "#/components/schemas/NullableDecimal"
        fat_g_target:
          $ref: "#/components/schemas/NullableDecimal"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GoalCreate:
      type: object
      required: [starts_on]
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        start_weight_kg: { $ref: "#/components/schemas/Decimal" }
        target_weight_kg: { $ref: "#/components/schemas/Decimal" }
        weekly_rate_kg: { $ref: "#/components/schemas/Decimal" }
        daily_calorie_target: { type: integer, format: int32 }
        protein_g_target: { $ref: "#/components/schemas/Decimal" }
        carbs_g_target: { $ref: "#/components/schemas/Decimal" }
        fat_g_target: { $ref: "#/components/schemas/Decimal" }

    GoalPatch:
      type: object
      description: Any omitted field is left unchanged.
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        start_weight_kg: { $ref: "#/components/schemas/Decimal" }
        target_weight_kg: { $ref: "#/components/schemas/Decimal" }
        weekly_rate_kg: { $ref: "#/components/schemas/Decimal" }
        daily_calorie_target: { type: integer, format: int32 }
        protein_g_target: { $ref: "#/components/schemas/Decimal" }
        carbs_g_target: { $ref: "#/components/schemas/Decimal" }
        fat_g_target: { $ref: "#/components/schemas/Decimal" }

    NutritionPer100g:
      type: object
      description: Per-100g nutrition. All fields are optional/nullable.
      properties:
        energy_kcal: { $ref: "#/components/schemas/Decimal" }
        protein_g: { $ref: "#/components/schemas/Decimal" }
        carbs_g: { $ref: "#/components/schemas/Decimal" }
        fat_g: { $ref: "#/components/schemas/Decimal" }
        fiber_g: { $ref: "#/components/schemas/Decimal" }
        sugar_g: { $ref: "#/components/schemas/Decimal" }
        sodium_g:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: |
            Sodium in grams per 100 g (OFF convention). Clients should
            multiply by 1000 to display as milligrams, which is the
            customer-expected unit.
        saturated_fat_g: { $ref: "#/components/schemas/Decimal" }

    Serving:
      type: object
      required: [id, label, grams, is_default, source, sort_order]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        grams: { $ref: "#/components/schemas/Decimal" }
        is_default: { type: boolean }
        source: { $ref: "#/components/schemas/ServingSource" }
        sort_order: { type: integer, format: int32 }

    ServingCreate:
      type: object
      required: [label, grams]
      properties:
        label: { type: string }
        grams: { $ref: "#/components/schemas/Decimal" }
        is_default: { type: boolean, default: false }
        source:
          allOf:
            - $ref: "#/components/schemas/ServingSource"
          description: Defaults to `user` if omitted.
        sort_order: { type: integer, format: int32, default: 0 }

    ServingPatch:
      type: object
      description: |
        Partial update of a serving. Toggling `is_default` is done via the
        dedicated `POST /servings/{id}/default` endpoint, not this one.
      properties:
        label: { type: string }
        grams: { $ref: "#/components/schemas/Decimal" }
        sort_order: { type: integer, format: int32 }

    ServingPreview:
      type: object
      required: [id, label, grams]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        grams: { $ref: "#/components/schemas/Decimal" }

    FoodDetail:
      type: object
      required:
        - id
        - source
        - kind
        - name
        - categories_tags
        - nutrition
        - quality_score
        - servings
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/FoodSource" }
        kind: { $ref: "#/components/schemas/FoodKind" }
        owner_user_id:
          type: [string, "null"]
          format: uuid
        barcode:
          type: [string, "null"]
        fdc_id:
          type: integer
          format: int64
          description: USDA FoodData Central id, present for `usda`-sourced foods only.
        name: { type: string }
        brands:
          type: [string, "null"]
        categories_tags:
          type: array
          items: { type: string }
        nutrition: { $ref: "#/components/schemas/NutritionPer100g" }
        nutriscore:
          oneOf:
            - $ref: "#/components/schemas/NutriscoreGrade"
            - type: "null"
        quality_score: { type: integer, format: int32 }
        extra_nutrients:
          description: Free-form JSON of additional nutrients, if any.
        servings:
          type: array
          items: { $ref: "#/components/schemas/Serving" }

    FoodCreate:
      type: object
      required: [name, nutrition]
      description: |
        Create a new user-custom food. The name `__quick_add__` is reserved
        for the internal quick-add sentinel and returns 400.
      properties:
        name: { type: string }
        brands: { type: string }
        barcode: { type: string }
        categories_tags:
          type: array
          items: { type: string }
          default: []
        nutrition: { $ref: "#/components/schemas/NutritionPer100g" }
        nutriscore_grade: { $ref: "#/components/schemas/NutriscoreGrade" }

    QuickAddBody:
      type: object
      required: [calories_kcal, meal, consumed_on]
      properties:
        calories_kcal:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Must be > 0 and < 9999.
          exclusiveMinimum: 0
          maximum: 9998
        meal: { $ref: "#/components/schemas/Meal" }
        consumed_on: { type: string, format: date }
        note: { type: string }

    CopyDayBody:
      type: object
      required: [from_date, to_date]
      properties:
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        meal:
          oneOf:
            - $ref: "#/components/schemas/Meal"
            - type: "null"
          description: If present, only entries with this meal are copied.

    CopyDayResponse:
      type: object
      required: [copied]
      properties:
        copied:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }

    FoodPatch:
      type: object
      description: Any omitted field is left unchanged.
      properties:
        name: { type: string }
        brands: { type: string }
        barcode: { type: string }
        categories_tags:
          type: array
          items: { type: string }
        nutrition: { $ref: "#/components/schemas/NutritionPer100g" }
        nutriscore_grade: { $ref: "#/components/schemas/NutriscoreGrade" }

    FoodSearchHit:
      type: object
      required: [id, source, name]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/FoodSource" }
        name: { type: string }
        brand:
          type: [string, "null"]
        barcode:
          type: [string, "null"]
        default_serving:
          oneOf:
            - $ref: "#/components/schemas/ServingPreview"
            - type: "null"
        calories_per_serving:
          $ref: "#/components/schemas/NullableDecimal"

    Paginated:
      type: object
      required: [results, total, limit, offset]
      properties:
        results:
          type: array
          description: Replaced by the concrete schema in allOf compositions.
          items: {}
        total:
          type: integer
          format: int64
          description: Total matching rows across all pages.
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64

    PaginatedFoodSearchHits:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/FoodSearchHit" }

    PaginatedLogEntries:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/LogEntry" }

    PaginatedWeights:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/Weight" }

    LogEntry:
      type: object
      description: |
        A logged consumption event with a frozen nutrition snapshot. The
        nutrition fields are flattened onto the entry rather than nested.
      required:
        - id
        - food_id
        - consumed_on
        - meal
        - quantity
        - grams_total
        - calories_kcal
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        food_id: { type: string, format: uuid }
        serving_id:
          type: [string, "null"]
          format: uuid
        consumed_on: { type: string, format: date }
        meal: { $ref: "#/components/schemas/Meal" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        grams_total: { $ref: "#/components/schemas/Decimal" }
        calories_kcal: { $ref: "#/components/schemas/Decimal" }
        protein_g:
          $ref: "#/components/schemas/NullableDecimal"
        carbs_g:
          $ref: "#/components/schemas/NullableDecimal"
        fat_g:
          $ref: "#/components/schemas/NullableDecimal"
        fiber_g:
          $ref: "#/components/schemas/NullableDecimal"
        sugar_g:
          $ref: "#/components/schemas/NullableDecimal"
        sodium_mg:
          $ref: "#/components/schemas/NullableDecimal"
        saturated_fat_g:
          $ref: "#/components/schemas/NullableDecimal"
        note:
          type: [string, "null"]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LogCreate:
      type: object
      required: [food_id, serving_id, consumed_on, meal, quantity]
      properties:
        food_id: { type: string, format: uuid }
        serving_id: { type: string, format: uuid }
        consumed_on: { type: string, format: date }
        meal: { $ref: "#/components/schemas/Meal" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        note: { type: string }

    LogPatch:
      type: object
      description: |
        Partial update. Sending `food_id` returns `400`. Sending `"note":
        null` clears the value; omitting the key leaves it untouched.
      properties:
        serving_id: { type: string, format: uuid }
        consumed_on: { type: string, format: date }
        meal: { $ref: "#/components/schemas/Meal" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        note:
          type: [string, "null"]

    NutritionTotal:
      type: object
      required: [calories_kcal]
      properties:
        calories_kcal: { $ref: "#/components/schemas/Decimal" }
        protein_g:
          $ref: "#/components/schemas/NullableDecimal"
        carbs_g:
          $ref: "#/components/schemas/NullableDecimal"
        fat_g:
          $ref: "#/components/schemas/NullableDecimal"
        fiber_g:
          $ref: "#/components/schemas/NullableDecimal"
        sugar_g:
          $ref: "#/components/schemas/NullableDecimal"
        sodium_mg:
          $ref: "#/components/schemas/NullableDecimal"
        saturated_fat_g:
          $ref: "#/components/schemas/NullableDecimal"

    MealSubtotal:
      type: object
      required: [meal, calories_kcal, protein_g, carbs_g, fat_g, entry_count]
      properties:
        meal: { $ref: "#/components/schemas/Meal" }
        calories_kcal: { $ref: "#/components/schemas/Decimal" }
        protein_g: { $ref: "#/components/schemas/Decimal" }
        carbs_g: { $ref: "#/components/schemas/Decimal" }
        fat_g: { $ref: "#/components/schemas/Decimal" }
        entry_count: { type: integer, format: int32, minimum: 0 }

    DaySummary:
      type: object
      required: [date, total, by_meal]
      properties:
        date: { type: string, format: date }
        total: { $ref: "#/components/schemas/NutritionTotal" }
        by_meal:
          type: array
          description: One subtotal per meal in canonical order; empty meals included.
          items: { $ref: "#/components/schemas/MealSubtotal" }
        active_goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
