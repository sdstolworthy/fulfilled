# Strict-ish lints for the Fulfilled client. The aim is to catch the
# tenant violations a reviewer would otherwise miss in code review:
# raw widget literals (T-01) are not lintable cheaply, but consistent
# style is, so we lean on it.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing return type / required trailing comma as errors so they
    # don't slip in via PRs.
    missing_return: error
    always_declare_return_types: error
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/generated/**'

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    sort_pub_dependencies: false
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    unawaited_futures: true
