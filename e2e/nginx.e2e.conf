# Nginx config used ONLY by the e2e web container. Mounted over
# /etc/nginx/conf.d/default.conf by compose.e2e.yaml.
#
# Mirrors client/nginx.conf (SPA fallback, asset caching) and adds an
# `/api/v1/` reverse-proxy block that forwards to the api service on the
# compose network. That keeps the Flutter web bundle's runtime
# apiBaseUrl resolution (`window.location.origin + '/api/v1'`) reachable
# without modifying any production config or building a separate proxy
# sidecar.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck file the web container's healthcheck hits.
    location = /health.txt {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # Reverse proxy to the api service. `api` resolves to the compose
    # network DNS entry for the api container. The trailing slash on
    # the upstream is intentional: `proxy_pass http://api:8080/api/v1/`
    # preserves the `/api/v1` prefix end-to-end so the Rust router (which
    # mounts under `/api/v1`) matches the path verbatim.
    location /api/v1/ {
        proxy_pass http://api:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA routing: any missing path falls back to index.html so the
    # Flutter router can take over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Hashed Flutter assets — cache aggressively, fall through to 404
    # rather than the SPA fallback so missing asset URLs surface as
    # real failures in tests.
    location ~* \.(?:js|css|wasm|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;
}
